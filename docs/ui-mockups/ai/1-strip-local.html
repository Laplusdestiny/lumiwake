<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>案B 候補ストリップ型（ローカル）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#6cb2ff}a:hover{color:#a6d0ff}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border:1px solid #3a404b;border-bottom-width:2px;border-radius:5px;background:#262a32;color:#e6e8eb;font-family:'JetBrains Mono',monospace;font-size:12px}
.path{font-family:'JetBrains Mono',monospace;font-size:11px;color:#9aa1ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #121418; color: #e6e8eb; font-family: 'IBM Plex Sans JP', 'Noto Sans JP', sans-serif; font-size: 14px">

  <header style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid #2c313a; background: #1a1d23">
    <div style="font-weight: 700; font-size: 15px; letter-spacing: 0.02em">Lumiwake</div>
    <div class="path" style="font-size: 12px">D:\Photos\未整理</div>
    <div style="flex-grow: 1"></div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px">128 / 412</div>
    <div style="display: flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid #2c313a; border-radius: 999px; font-size: 12px; color: #c9cdd4">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #5fcf8a"></span>
      AI：ローカル CLIP
    </div>
    <div style="font-size: 12px; color: #9aa1ad">先読み 5/5</div>
  </header>

  <div style="flex-grow: 1; display: grid; grid-template-columns: minmax(0, 1fr) 248px; min-height: 0">

    <main style="display: flex; flex-direction: column; padding: 20px; gap: 14px; min-width: 0">
      <div style="flex-grow: 1; border-radius: 8px; background: repeating-linear-gradient(135deg, #1b1e24 0 14px, #1f2229 14px 28px); display: flex; align-items: center; justify-content: center; color: #6f7682; font-size: 13px">プレビュー画像</div>

      <div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: #9aa1ad"><span><span style="color: #e6e8eb; font-weight: 600; font-size: 14px">IMG_2041.jpg</span>　4032×3024 · 3.2 MB</span><span>一致度（確率ではありません）· 診断済み</span></div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <div style="padding: 14px; border-radius: 8px; background: #1a1d23; outline: 2px solid #6cb2ff; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span class="kbd">1</span>
            <span style="font-size: 18px; font-weight: 700">猫</span>
            <div style="flex-grow: 1"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: #6cb2ff">0.86</span>
          </div>
          <div class="path">D:\Photos\仕分け\猫</div>
          <div style="height: 6px; border-radius: 3px; background: #2c313a"><div style="width: 86%; height: 6px; border-radius: 3px; background: #6cb2ff"></div></div>
        </div>
        <div style="padding: 14px; border-radius: 8px; background: #1a1d23; outline: 1px solid #2c313a; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span class="kbd">7</span>
            <span style="font-size: 18px; font-weight: 600">猫</span>
            <div style="flex-grow: 1"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #c9cdd4">0.52</span>
          </div>
          <div class="path">\\nas\share\写真\ペット\猫</div>
          <div style="height: 6px; border-radius: 3px; background: #2c313a"><div style="width: 52%; height: 6px; border-radius: 3px; background: #6b7380"></div></div>
        </div>
        <div style="padding: 14px; border-radius: 8px; background: #1a1d23; outline: 1px solid #2c313a; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span class="kbd">3</span>
            <span style="font-size: 18px; font-weight: 600">動物</span>
            <div style="flex-grow: 1"></div>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #c9cdd4">0.41</span>
          </div>
          <div class="path">D:\Photos\仕分け\動物</div>
          <div style="height: 6px; border-radius: 3px; background: #2c313a"><div style="width: 41%; height: 6px; border-radius: 3px; background: #6b7380"></div></div>
        </div>
      </div>
    </main>

    <aside style="border-left: 1px solid #2c313a; background: #1a1d23; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: hidden">
      <div style="padding: 0 4px 8px; font-size: 12px; font-weight: 600; color: #c9cdd4; letter-spacing: 0.04em">キー割り当て</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 5px; background: rgba(108,178,255,0.12)"><span class="kbd">1</span><span style="font-weight: 600">猫</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">2</span><span>風景</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">3</span><span>動物</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">4</span><span>料理</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">5</span><span>スクショ</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">6</span><span>あとで見る</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">7</span><span>猫 <span style="color: #9aa1ad; font-size: 12px">（nas）</span></span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">8</span><span>カフェ</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 4px"><span class="kbd">9</span><span>旅行</span></div>
      <div style="flex-grow: 1"></div>
      <div style="padding: 10px 4px 0; border-top: 1px solid #2c313a; font-size: 12px; color: #9aa1ad; line-height: 1.7">
        <div><span class="kbd">Del</span> 削除予定</div>
        <div><span class="kbd">Ctrl</span>+<span class="kbd">Z</span> 元に戻す</div>
        <div><span class="kbd">Space</span> スキップ</div>
        <div>行にマウスを載せるとフルパス</div>
      </div>
    </aside>
  </div>
</div>
</body>
</html>

[package]
name = "lumiwake"
version = "0.2.0"
description = "キーボード操作で画像をすばやくフォルダへ振り分けるデスクトップアプリ"
authors = ["Laplusdestiny"]
license = "MIT"
repository = "https://github.com/laplusdestiny/lumiwake"
edition = "2021"
rust-version = "1.85"

[lib]
# Tauri のモバイル対応テンプレートに合わせ、バイナリとライブラリを分ける
name = "lumiwake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# WebView 由来のショートカット（再読み込み・検索・印刷など）が振り分けキーと衝突しないよう無効にする
tauri-plugin-prevent-default = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
toml = "1"
# 標準で使う形式だけを有効にし、配布サイズを抑える（AVIF は下の feature で追加）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
# AI 診断キャッシュのキー（画像ファイルの中身のハッシュ）
blake3 = "1"
# 診断キャッシュ・履歴の保存先。bundled で SQLite を同梱し、Windows でも別途ライブラリを要らなくする
rusqlite = { version = "0.40", features = ["bundled"] }
# System One 互換 API への同期 HTTP クライアント（TLS は rustls で、Windows でも OpenSSL を要らなくする）
ureq = "3"
base64 = "0.22"
libheif-rs = { version = "2", optional = true, default-features = false, features = ["v1_17"] }

[features]
default = []
# AVIF の表示（C ライブラリ libdav1d が必要）
avif = ["image/avif-native"]
# HEIC/HEIF の表示（C ライブラリ libheif が必要）
heic = ["dep:libheif-rs"]

# Windows（WebView2）ではブラウザのアクセラレータキーも無効にする
[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"

# 開発・テスト時も画像処理の依存クレートは最適化してビルドする（デバッグビルドだと極端に遅い）
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# 配布サイズを抑える
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[dev-dependencies]
tempfile = "3"
# コマンドを State 付きで呼ぶテスト用（tauri::test::mock_app）
tauri = { version = "2", features = ["test"] }
